name: snekid
description: "A Flutter app that helps identify snake species and provides all relevant information."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.3.0

  # Network
  http: ^1.2.2

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Permissions
  permission_handler: ^11.3.1

  # UI
  cupertino_icons: ^1.0.8
  logger: ^2.6.2
  springster: ^0.4.0+1
  ming_cute_icons: ^0.0.7
  audioplayers: ^6.5.1
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.2
  share_plus: ^10.1.2
  pull_down_button: ^0.10.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding_images/
    - assets/images/ui_illustrations/
    - assets/sounds/
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900

flutter_native_splash:
  color: "#FEFEFE"
  image: assets/images/app_icon/splash_image.png
  android_12:
    image: assets/images/app_icon/splash_image.png
    color: "#FEFEFE"
  ios: true
  android: true
